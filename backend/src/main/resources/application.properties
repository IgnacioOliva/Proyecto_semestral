# DoggySpa - recuperado sobre demo oficial Spring Initializr
spring.application.name=doggyspa
server.port=8080

# H2 en memoria (misma logica que la semana 12)
spring.datasource.url=jdbc:h2:mem:doggyspa;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Consola H2 (solo para desarrollo local)
spring.h2.console.enabled=true
