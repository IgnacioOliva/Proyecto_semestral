# Perfil de laboratorio: XAMPP -> MariaDB (panel rotulado "MySQL")
# Activar con el perfil Spring: -Dspring-boot.run.profiles=mysql; no requiere perfil Maven
spring.datasource.url=jdbc:mariadb://localhost:${DB_PORT:3306}/doggyspa
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
# Generacion didactica de las tablas a partir de @Entity; NO usar en produccion.
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false
