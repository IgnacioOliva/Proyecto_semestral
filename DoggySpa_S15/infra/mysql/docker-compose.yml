services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: rootdemo
      MYSQL_DATABASE: doggyspa
      MYSQL_USER: doggyspa
      MYSQL_PASSWORD: doggyspa123
    ports:
      - "3306:3306"
    volumes:
      - doggyspa_datos:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -prootdemo --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  doggyspa_datos:
